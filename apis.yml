aid: biotree
name: Biotree
description: Biotree (Shanghai Biotree Biomedical Technology, 百趣生物) is a Shanghai-based
  life-sciences company founded in 2012 that provides mass-spectrometry-driven metabolomics,
  proteomics, transcriptomics, and multi-omics products and services. It operates non-targeted
  and high-throughput targeted metabolomics platforms, single-cell and spatial omics,
  pharmaceutical protein characterization, clinical diagnostic test kits, and CDMO services,
  backed by a proprietary compound spectral library of 20,000+ standards, automated
  sample-preparation systems (Starlid), a LIMS, and the MAPS cloud analysis portal.
  Surfaced as a portfolio company of the venture firm Qiming and profiled in the API
  Evangelist network. No public developer API or specification is published at this time.
